name: trifecta-scan

# Example self-scan: gate pull requests on lethal-trifecta findings and publish
# results to GitHub Code Scanning. Point --path at your agent code.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  trifecta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run Trifecta-Static
        run: >
          trifecta scan tests/fixtures
          --depth deep
          --format sarif
          -o trifecta.sarif
          --fail-on critical
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trifecta.sarif
